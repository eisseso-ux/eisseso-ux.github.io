name: Image Optimizer

on:
  push:
    # run when image files change or when workflow files update in .github/
    paths:
      - 'images/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate optimized high-res thumbnails
        run: |
          set -euo pipefail
          mkdir -p thumbs/images

          # Remove legacy non-webp artifacts so thumbs stays a clean mirror.
          if [ -d thumbs/images ]; then
            find thumbs/images -type f ! -iname '*.webp' -delete
          fi

          # Delete stale webp thumbs that no longer have a matching source image.
          if [ -d thumbs/images ]; then
            find thumbs/images -type f -iname '*.webp' -print0 | while IFS= read -r -d '' thumb; do
              rel="${thumb#thumbs/}"
              base="${rel%.webp}"
              dir="$(dirname "$base")"
              name="$(basename "$base")"
              if ! find "$dir" -maxdepth 1 -type f \( -iname "${name}.jpg" -o -iname "${name}.jpeg" -o -iname "${name}.png" -o -iname "${name}.gif" \) | grep -q .; then
                rm -f "$thumb"
              fi
            done
          fi

          # Only generate missing thumbs or thumbs older than their source image.
          find images -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.gif' \) -print0 | while IFS= read -r -d '' img; do
            thumb="thumbs/${img%.*}.webp"
            mkdir -p "$(dirname "$thumb")"
            if [ -f "$thumb" ] && [ "$thumb" -nt "$img" ]; then
              continue
            fi
            # 720px longest side keeps thumbnails crisp on modern/high-DPI displays.
            convert "$img" \
              -auto-orient \
              -resize '720x720>' \
              -strip \
              -quality 82 \
              -define webp:method=6 \
              -define webp:auto-filter=true \
              "$thumb"
          done

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A thumbs || true
          if git diff --cached --quiet; then
            echo "No thumbnail changes to commit"
            exit 0
          fi
          git commit -m "Update optimized thumbnails"
          git push
