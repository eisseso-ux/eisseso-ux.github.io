name: Image Optimizer

on:
  push:
    # run when image files change or when workflow files update in .github/
    paths:
      - 'images/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate optimized high-res thumbnails
        run: |
          set -euo pipefail
          mkdir -p thumbs
          find images -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.gif' \) -print0 | while IFS= read -r -d '' img; do
            thumb="thumbs/${img%.*}.webp"
            mkdir -p "$(dirname "$thumb")"
            # 720px longest side keeps thumbnails crisp on modern/high-DPI displays.
            convert "$img" \
              -auto-orient \
              -resize '720x720>' \
              -strip \
              -quality 82 \
              -define webp:method=6 \
              -define webp:auto-filter=true \
              "$thumb"
          done

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add thumbs || true
          git commit -m "Update optimized thumbnails" || true
          git push || true
