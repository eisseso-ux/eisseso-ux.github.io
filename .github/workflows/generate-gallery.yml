name: Generate Recursive Gallery JSON

on:
  push:
    paths:
      - 'images/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Generate gallery.json in every folder recursively
        shell: bash
        run: |
          # Handle every directory recursively, including paths with spaces.
          find images -type d -print0 | while IFS= read -r -d '' dir; do
            echo "Processing $dir"

            output="$dir/gallery.json"

            # Build a list of images directly inside this directory only.
            files=()
            while IFS= read -r -d '' file; do
              lower="${file,,}"
              case "$lower" in
                *.jpg|*.jpeg|*.png|*.webp|*.gif)
                  files+=("$file")
                  ;;
              esac
            done < <(find "$dir" -maxdepth 2 -type f -print0)

            : > "$output"
            printf '[\n' >> "$output"
            if [ ${#files[@]} -eq 0 ]; then
              echo "No images in $dir - writing empty gallery.json"
            else
              for i in "${!files[@]}"; do
                file="${files[$i]}"
                if [ "$i" -lt "$(( ${#files[@]} - 1 ))" ]; then
                  printf '  "%s",\n' "$file" >> "$output"
                else
                  printf '  "%s"\n' "$file" >> "$output"
                fi
              done
            fi
            printf ']\n' >> "$output"
          done

      - name: Commit updated gallery.json files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          find images -type f -name "gallery.json" -print0 | xargs -0 git add
          git commit -m "Auto-update recursive gallery.json files" || echo "No changes"
          git push