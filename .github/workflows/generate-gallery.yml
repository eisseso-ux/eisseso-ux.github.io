name: Generate Recursive Gallery JSON

on:
  push:
    paths:
      - 'images/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Generate gallery.json in every folder recursively
        run: |
          # Handle every directory recursively, including paths with spaces.
          find images -type d -print0 | while IFS= read -r -d '' dir; do
            echo "Processing $dir"

            output="$dir/gallery.json"

            # Build a sorted list of images directly inside this directory only.
            mapfile -d '' files < <(find "$dir" -maxdepth 1 -type f \(
              -iname "*.jpg" -o
              -iname "*.jpeg" -o
              -iname "*.png" -o
              -iname "*.webp" -o
              -iname "*.gif"
            \) -print0 | sort -z)

            if [ ${#files[@]} -eq 0 ]; then
              echo "No images in $dir - skipping"
              continue
            fi

            : > "$output"
            printf '[\n' >> "$output"
            for i in "${!files[@]}"; do
              file="${files[$i]%$'\0'}"
              if [ "$i" -lt "$(( ${#files[@]} - 1 ))" ]; then
                printf '  "%s",\n' "$file" >> "$output"
              else
                printf '  "%s"\n' "$file" >> "$output"
              fi
            done
            printf ']\n' >> "$output"
          done

      - name: Commit updated gallery.json files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add images/**/gallery.json
          git commit -m "Auto-update recursive gallery.json files" || echo "No changes"
          git push