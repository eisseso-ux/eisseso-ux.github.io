<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects & Artworks | Olivia Eisses</title>
    <meta
      name="description"
      content="Browse project categories and artwork galleries by Olivia Eisses."
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="images/logos/slug logo plain.svg" />
  </head>
  <body>
    <header class="site-header compact-header">
      <div class="container header-row">
        <div class="header-left">
          <img src="images/logos/oliviaeissesnamelogo.svg" alt="Olivia Eisses" class="site-signature" />
          <img src="images/logos/slug logo plain.svg" alt="Slug logo" class="slug-logo header-slug-logo" />
        </div>
        <div class="header-right">
          <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <div class="nav-dropdown">
              <a href="projects.html" class="drop-toggle" aria-haspopup="true" aria-expanded="false" aria-current="page">Projects &amp; Artworks</a>
              <div class="dropdown-menu" aria-label="Project categories">
                <a href="drawing-printmaking-painting.html">Drawing / Printmaking / Painting</a>
                <a href="plush.html">Fleece Animals</a>
                <a href="sculpture.html">Gallery Work</a>
                <a href="wearable-design.html">Clothing Design</a>
              </div>
            </div>
          </nav>
        </div>
      </div>
    </header>
    
    <main class="projects-main">
      <div class="container projects-intro">
        <h2>Projects &amp; Artworks</h2>
      </div>
      <div class="container projects-categories" id="gallery-root"></div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <img src="images/logos/slug logo plain.svg" alt="Slug logo" class="slug-logo footer-slug-logo" />
        <p>&copy; <span id="year"></span> Olivia Eisses. All rights reserved.</p>
      </div>
    </footer>

    <script>
      (function(){
        const categories = [
          { title: 'Fleece Animals', href: 'plush.html', shape: 'blob' },
          { title: 'Gallery Work', href: 'sculpture.html', shape: 'star' },
          { title: 'Clothing Design', href: 'wearable-design.html', shape: 'squiggle' },
          { title: 'Drawing / Printmaking / Painting', href: 'drawing-printmaking-painting.html', shape: 'sun' },
        ];

        const root = document.getElementById('gallery-root');
        root.innerHTML = '';

        categories.forEach((cat, index) => {
          const card = document.createElement('a');
          card.className = 'project-card';
          card.href = cat.href;
          card.setAttribute('aria-label', cat.title);
          card.style.setProperty('--card-index', index);

          const shape = document.createElement('span');
          shape.className = `project-shape project-shape-${cat.shape}`;
          shape.setAttribute('aria-hidden', 'true');

          const title = document.createElement('span');
          title.className = 'project-card-title';
          title.textContent = cat.title;

          card.append(shape, title);
          root.appendChild(card);

          card.addEventListener('pointermove', (event) => {
            const bounds = card.getBoundingClientRect();
            const x = ((event.clientX - bounds.left) / bounds.width - 0.5) * 2;
            const y = ((event.clientY - bounds.top) / bounds.height - 0.5) * 2;
            card.style.setProperty('--pointer-x', `${x.toFixed(2)}`);
            card.style.setProperty('--pointer-y', `${y.toFixed(2)}`);
          });
          card.addEventListener('pointerleave', () => {
            card.style.setProperty('--pointer-x', '0');
            card.style.setProperty('--pointer-y', '0');
          });
        });
      })();
    </script>
    <script>
      (function(){
        const DELAY = 300;
        document.querySelectorAll('.nav-dropdown').forEach(drop => {
          let timeout = null;
          const toggle = drop.querySelector('.drop-toggle');
          function open(){
            clearTimeout(timeout);
            drop.classList.add('open');
            if(toggle) toggle.setAttribute('aria-expanded','true');
          }
          function close(){
            clearTimeout(timeout);
            timeout = setTimeout(()=>{
              drop.classList.remove('open');
              if(toggle) toggle.setAttribute('aria-expanded','false');
            }, DELAY);
          }
          drop.addEventListener('mouseenter', open);
          drop.addEventListener('mouseleave', close);
          drop.addEventListener('focusin', open);
          drop.addEventListener('focusout', close);
        });
      })();
    </script>
  </body>
</html>
