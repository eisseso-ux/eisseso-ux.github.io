<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olivia Eisses | Artist</title>
    <meta
      name="description"
      content="Personal artist website featuring artwork, artist bio, and contact information."
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="images/logos/slug logo plain.svg" />
  </head>
  <body>
    <header class="site-header compact-header">
      <div class="container header-row">
        <div class="header-left">
          <img src="images/logos/oliviaeissesnamelogo.svg" alt="Olivia Eisses" class="site-signature" />
          <img src="images/logos/slug logo plain.svg" alt="Slug logo" class="slug-logo header-slug-logo" />
        </div>
        <div class="header-right">
          <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html"  aria-current="page">Home</a>
            <a href="about.html">About</a>
            <div class="nav-dropdown">
              <a href="projects.html" class="drop-toggle" aria-haspopup="true" aria-expanded="false">Projects &amp; Artworks</a>
              <div class="dropdown-menu" aria-label="Project categories">
                <a href="drawing-printmaking-painting.html">Drawing / Printmaking / Painting</a>
                <a href="photography.html">Photography</a>
                <a href="plush.html">Plush</a>
                <a href="sculpture.html">Sculpture</a>
                <a href="wearable-design.html">Wearable Design</a>
              </div>
            </div>
          </nav>
        </div>
      </div>
    </header>

    <main>
      <section class="homepage-gallery" aria-label="Homepage gallery">
        <div class="homepage-gallery-viewport">
          <div class="homepage-gallery-track" id="homepage-gallery-track" aria-live="polite"></div>
        </div>
      </section>

      
      <section class="contact" id="contact">
        <div class="container text-block">
          <h2>Contact Me</h2>
          <p>
            For commissions, collaborations, exhibitions, or general inquiries,
            please reach out using the details below.
          </p>

        </div>
        <div class="contact-buttons">
            <a href="mailto:olivia.eisses@gmail.com" class="button-link">Contact</a>
            <a href="https://instagram.com/olivinepine" target="_blank" rel="noreferrer" class="button-link">Instagram</a>
            <a href="https://oliviaeissesart.etsy.com" target="_blank" rel="noreferrer" class="button-link">Shop</a>
          </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <img src="images/logos/slug logo plain.svg" alt="Slug logo" class="slug-logo footer-slug-logo" />
        <p>&copy; <span id="year"></span> Olivia Eisses. All rights reserved.</p>
      </div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
    <script>
      (function(){
        const DELAY = 300;
        document.querySelectorAll('.nav-dropdown').forEach(drop => {
          let timeout = null;
          const toggle = drop.querySelector('.drop-toggle');
          function open(){
            clearTimeout(timeout);
            drop.classList.add('open');
            if(toggle) toggle.setAttribute('aria-expanded','true');
          }
          function close(){
            clearTimeout(timeout);
            timeout = setTimeout(()=>{
              drop.classList.remove('open');
              if(toggle) toggle.setAttribute('aria-expanded','false');
            }, DELAY);
          }
          drop.addEventListener('mouseenter', open);
          drop.addEventListener('mouseleave', close);
          drop.addEventListener('focusin', open);
          drop.addEventListener('focusout', close);
        });
      })();
    </script>
    <script>
      (async function() {
        const track = document.getElementById('homepage-gallery-track');
        if (!track) return;

        try {
          const response = await fetch('images/homepage/gallery.json');
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const images = await response.json();
          if (!Array.isArray(images) || images.length === 0) return;

          const slides = images.map((src, index) => {
            const slide = document.createElement('div');
            slide.className = 'homepage-gallery-slide';
            if (index === 0) slide.classList.add('is-active');

            const image = document.createElement('img');
            image.src = src;
            image.alt = `Homepage gallery image ${index + 1}`;
            image.loading = index === 0 ? 'eager' : 'lazy';
            image.decoding = 'async';

            slide.appendChild(image);
            track.appendChild(slide);
            return slide;
          });

          if (slides.length < 3.5) return;

          let currentIndex = 0;
          window.setInterval(() => {
            slides[currentIndex].classList.remove('is-active');
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add('is-active');
          }, 2000);
        } catch (error) {
          console.error('Failed to load homepage gallery:', error);
        }
      })();
    </script>
  </body>
</html>
